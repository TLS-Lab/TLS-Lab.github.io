project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "research/"
  resources:
    - "images/microhubs-thumb.jpg"
  pre-render:
    - _build/generate_publications.py
    - _build/generate_news.py

website:
  title: "Usman Ahmed"
  description: "Transportation researcher — mobility, logistics, safety"
  site-url: "https://usmanahmed.net"
  google-analytics: "G-BDKLRBR5ZS"
  page-navigation: true
  back-to-top-navigation: false
  bread-crumbs: false

  navbar:
    title: false
    logo: logos/Logo1-navbar.png
    logo-alt: "Usman Ahmed"
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: modeling-tools.qmd
        text: Modeling Tools
      - href: publications.qmd
        text: Publications
      - href: projects.qmd
        text: Projects
      - href: teaching.qmd
        text: Teaching
      - href: team.qmd
        text: Team
      - href: news.qmd
        text: News
    right:
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact

  page-footer:
    left: |
      &copy; 2026 Usman Ahmed
    center: |
      UT-Oak Ridge Innovation Institute, University of Tennessee, Knoxville
    right:
      - text: "Scholar"
        href: https://scholar.google.com/citations?hl=en&user=eiM9m1EAAAAJ&view_op=list_works&sortby=pubdate
      - text: "GitHub"
        href: https://github.com
      - text: "LinkedIn"
        href: https://www.linkedin.com/in/uahmed16
    border: true

  search:
    location: navbar
    type: overlay

format:
  html:
    theme:
      - litera
      - _brand.yml
    css: styles.css
    toc: true
    toc-depth: 2
    link-external-icon: false
    link-external-newwindow: true
    grid:
      body-width: 1100px
    fontsize: 1.05rem
    linestretch: 1.7

execute:
  freeze: auto
